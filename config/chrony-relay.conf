# ECS Fargate 上の中継 chrony。時刻源は優先度の高い順に 3 段。
# Fargate では CAP_SYS_TIME を付けられないので chronyd -x で起動し、時計を動かさずに推定時刻を配る。
# 本番には local stratum を書かない。上流をすべて失ったら同期外れを返し、クライアントに捨てさせる。

# 1. Local Amazon Time Sync Service。PoC では localsync コンテナが代役。
#    本番は server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
#    (Fargate から届くかは公式に記載がないので AWS 上で実測する)
server localsync prefer iburst minpoll 4 maxpoll 4
# 2. Public Amazon Time Sync Service (NAT Gateway 経由)
pool time.aws.com iburst maxsources 2
# 3. 認証付きの外部時刻源 (NAT Gateway 経由)
server time.cloudflare.com iburst nts

# 2 つ以上の時刻源が一致しないと同期しない
minsources 2

# ヘルスチェック用サイドカーが同じタスク内から chronyc で読む
bindcmdaddress 127.0.0.1
cmdallow 127.0.0.1

allow all
ntsserverkey /poc/out/certs/timesrv.key
ntsservercert /poc/out/certs/timesrv.pem
# 複数タスクで NTS のサーバー鍵を共有する。本番は Secrets Manager から配る
ntsrotate 0
ntsdumpdir /tmp/nts
