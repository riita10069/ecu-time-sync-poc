# クラウド側時刻サーバー (PoC)。
# AWS 上では local の代わりに次を有効にして Amazon Time Sync Service に同期させる。
#   server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
#   refclock PHC /dev/ptp0 poll 0 delay 0.000010 prefer   # PHC 対応インスタンスのみ
local stratum 2
allow all
cmdport 0
keyfile /poc/out/keys/chrony.keys
ntsserverkey /poc/out/certs/timesrv.key
ntsservercert /poc/out/certs/timesrv.pem
ntsport 4460
ntsdumpdir /tmp/nts
